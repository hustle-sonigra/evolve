<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Prompt Refine</title>
    <link rel="stylesheet" href="popup.css" />
  </head>
  <body>
    <main>
      <p class="eyebrow">PROMPT REFINE</p>
      <h1>Prompt Refine settings</h1>
      <label for="groq-api-key">Your Groq API key</label>
      <input
        id="groq-api-key"
        name="groq-api-key"
        type="password"
        autocomplete="off"
        spellcheck="false"
        placeholder="Paste your Groq API key"
      />
      <div class="key-actions">
        <button id="save-key" type="button">Save key</button>
        <button id="test-key" class="secondary-button" type="button">Test key</button>
        <button id="remove-key" class="secondary-button" type="button">Remove key</button>
      </div>
      <p class="hint">The key stays in this browser profile. Prompts are sent directly to Groq.</p>
      <p id="key-status" role="status" aria-live="polite">No key saved yet.</p>
      <h2>Optimization style</h2>
      <label for="mode">Choose a mode for Alt+Shift+P</label>
      <select id="mode" name="mode">
        <option value="BASIC">Basic</option>
        <option value="LEARNING">Learning</option>
        <option value="CODING">Coding</option>
        <option value="WRITING">Writing</option>
      </select>
      <p id="status" role="status" aria-live="polite">Saved on this browser.</p>
      <p class="hint">Focus a supported site's prompt editor, then press Alt+Shift+P.</p>
    </main>
    <script src="popup.js"></script>
  </body>
</html>
